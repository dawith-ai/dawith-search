[package]
name = "dawith-search"
version = "1.2.2"
description = "Lightweight cross-platform file search for Dawith"
authors = ["Dawith"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
rfd = "0.15"
trash = "5"
walkdir = "2"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
lopdf = "0.34"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff"] }
hwp = { git = "https://github.com/openhwp/openhwp", package = "hwp" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

