name: Windows release

# Build the public Windows installer when a GitHub release is published.
# The regular CI package is retained for pull-request and push validation;
# this workflow attaches the verified installer to the release users download.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload (for example v1.3.24)
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: Build and upload Windows installer
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run build:win

      - name: Verify packaged app contents
        run: node scripts/verify-build-artifacts.js

      - name: Upload Windows installers to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          files=(dist/DawithSearch-*.exe dist/nsis-web/DawithSearch-*.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo 'No Windows installers were built.' >&2
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
