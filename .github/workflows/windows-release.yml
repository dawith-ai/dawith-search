name: Windows release

# Build the lightweight Tauri installer (about 5 MB) when a GitHub release is
# published and attach it under two names:
#   Dawith-Search_<ver>_x64-setup.exe  the download page and the Tauri app's updater
#   DawithSearch-<ver>-portable.exe    the 1.3.22-1.3.24 Electron app's updater, so
#                                      those users move to the Tauri build too
# If a maintainer already uploaded a verified installer under a name, that
# file is kept (its SHA-256 is published on the download page).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload (for example v1.3.25)
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: Build and upload Windows installer
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri installer
        run: npm run build:tauri

      - name: Verify Tauri artifacts
        run: npm run verify:tauri

      - name: Upload Windows installer to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          setup=$(ls src-tauri/target/release/bundle/nsis/*_x64-setup.exe | head -n 1)
          if [ -z "$setup" ]; then
            echo 'No Windows installer was built.' >&2
            exit 1
          fi
          mkdir -p upload
          cp "$setup" "upload/Dawith-Search_${version}_x64-setup.exe"
          cp "$setup" "upload/DawithSearch-${version}-portable.exe"
          existing=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for file in upload/*.exe; do
            name=$(basename "$file")
            if grep -qxF "$name" <<<"$existing"; then
              echo "Keeping the $name already on the release."
            else
              gh release upload "$TAG" "$file"
            fi
          done
