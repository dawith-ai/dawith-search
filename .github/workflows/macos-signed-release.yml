name: macOS release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload (for example v1.3.22)
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos:
    name: Build and upload macOS DMG
    runs-on: macos-15
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Select signed or no-cost unsigned distribution
        id: signing
        shell: bash
        run: |
          present=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID KEYCHAIN_PASSWORD; do
            [[ -z "${!name:-}" ]] || ((present+=1))
          done
          if [[ "$present" -eq 0 ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No Apple signing secrets configured; building the free-download DMG." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$present" -eq 6 ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Apple Developer ID signing and notarization will be used." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Apple signing is partially configured. Provide all six secrets or remove them all." >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add universal Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Import Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          identity=$(security find-identity -v -p codesigning build.keychain \
            | awk -F'"' '/Developer ID Application/ { print $2; exit }')
          if [[ -z "$identity" ]]; then
            echo "No Developer ID Application identity was imported." >&2
            security find-identity -v -p codesigning build.keychain >&2 || true
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          rm -f certificate.p12

      - name: Build universal DMG
        run: npx tauri build --target universal-apple-darwin --bundles dmg

      - name: Verify app bundle and architecture
        shell: bash
        env:
          SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          set -euo pipefail
          dmg=$(find src-tauri/target -type f -name '*.dmg' -print -quit)
          [[ -n "$dmg" ]] || { echo 'DMG was not produced.' >&2; exit 1; }
          mountpoint=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mountpoint" >/dev/null
          app=$(find "$mountpoint" -maxdepth 1 -name '*.app' -print -quit)
          [[ -n "$app" ]] || { echo 'App bundle was not found in DMG.' >&2; exit 1; }
          executable="$app/Contents/MacOS/dawith-search"
          [[ -f "$executable" ]] || { echo 'Dawith Search executable was not found.' >&2; exit 1; }
          architectures=$(lipo -archs "$executable")
          [[ "$architectures" == *arm64* && "$architectures" == *x86_64* ]] || { echo "Expected universal binary, got: $architectures" >&2; exit 1; }
          if [[ "$SIGNED" == 'true' ]]; then
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=4 "$app"
          else
            echo 'No-cost DMG is not Developer ID signed or notarized; first-open instructions are on the download page.'
          fi
          hdiutil detach "$mountpoint" >/dev/null

      - name: Upload macOS DMG to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg=$(find src-tauri/target -type f -name '*.dmg' -print -quit)
          gh release upload "$TAG" "$dmg" --clobber
