name: Dawith Search CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            e2e_command: xvfb-run -a npm run test:e2e
          - os: macos-15
            e2e_command: npm run test:e2e
          - os: windows-latest
            e2e_command: npm run test:e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Rust for native Windows backend
        if: matrix.os == 'windows-latest'
        uses: dtolnay/rust-toolchain@stable
      - name: Setup MSVC for Everything SDK IPC helper
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Run Electron E2E
        shell: bash
        run: ${{ matrix.e2e_command }}

  package:
    name: Package (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            command: npm run build:mac
          - os: windows-latest
            command: npm run build:win
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Rust for native Windows backend
        if: matrix.os == 'windows-latest'
        uses: dtolnay/rust-toolchain@stable
      - name: Setup MSVC for Everything SDK IPC helper
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install dependencies
        run: npm ci
      - name: Build installer
        run: ${{ matrix.command }}
      - name: Verify packaged app contents
        run: node scripts/verify-build-artifacts.js
      - name: Upload verified installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dawith-search-${{ matrix.os }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  package-tauri:
    name: Package Tauri (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
          - os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup MSVC for Everything SDK IPC helper
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install dependencies
        run: npm ci
      - name: Add macOS universal Rust targets
        if: matrix.os == 'macos-15'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build Windows native search helpers
        if: matrix.os == 'windows-latest'
        run: npm run build:everything-ipc:win && npm run build:goz:win
      - name: Build Tauri package
        if: matrix.os == 'macos-15'
        run: npm run build:tauri -- --target universal-apple-darwin
      - name: Build Tauri Windows package
        if: matrix.os == 'windows-latest'
        run: npm run build:tauri
      - name: Verify Tauri package contents
        run: npm run verify:tauri
      - name: Upload Tauri artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dawith-search-tauri-${{ matrix.os }}-${{ github.sha }}
          path: src-tauri/target/**/bundle/**/*
          if-no-files-found: error
          retention-days: 14
